<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SSH 助手 · MCP</title>
<style>
:root{--bg:#f7f7f8;--l1:#fff;--l2:#f0f0f2;--overlay:#fff;--b1:#e3e3e6;--b2:#c9c9cf;--fg:#1d1d20;--fg2:#6b6b73;--brand:#3b6cf6;--ok:#1f9d55;--warn:#c98a00;--err:#d64545;color-scheme:light dark}
@media (prefers-color-scheme: dark){:root{--bg:#141416;--l1:#1b1b1e;--l2:#232327;--overlay:#1e1e22;--b1:#2c2c31;--b2:#3d3d44;--fg:#ececf0;--fg2:#9a9aa3;--brand:#7c9cff;--ok:#3ccf7c;--warn:#e0a83a;--err:#ef6b6b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:13px/20px system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
.top{display:flex;align-items:center;gap:10px;padding:14px 40px;border-bottom:1px solid var(--b1);position:sticky;top:0;background:var(--bg);z-index:5}
.mark{display:flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:8px;background:var(--l2);color:var(--brand)}
.title{font-size:14px;font-weight:600}.sub{font-size:12px;color:var(--fg2)}.grow{flex:1}
.content{max-width:1240px;margin:0 auto;padding:24px 40px 40px;display:flex;flex-direction:column;gap:22px}
.sec{font-size:12px;font-weight:600;color:var(--fg2);letter-spacing:.04em;margin-bottom:10px;display:flex;align-items:center;gap:10px}
.note{font-size:12px;color:var(--fg2);margin:-4px 0 10px}
.table{border:1px solid var(--b1);border-radius:12px;background:var(--l1);overflow:hidden}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:9px 16px;padding:11px 16px}
.row+.row{border-top:1px solid var(--b1)}
.row:hover{background:var(--l2)}
.th{display:flex;gap:9px 16px;padding:8px 16px;border-bottom:1px solid var(--b1);background:var(--l2);color:var(--fg2);font-size:11.5px}
.c-host{flex:0 0 170px;min-width:0}.c-key{flex:0 0 130px;min-width:0}.c-state{flex:0 0 140px;min-width:0}.c-ctl{flex:0 0 400px;display:flex;align-items:center;gap:10px}.c-remark{flex:1 1 150px;min-width:120px}
.c-ctl select.btn,.c-ctl .open{width:96px}.c-key .btn.link{margin-left:-6px;height:20px;font-size:11px}
.name{font-weight:600}.muted{color:var(--fg2)}.small{font-size:11px}.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.state-main{display:flex;align-items:center;gap:6px}
.dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;background:var(--b2)}
.dot.connected{background:var(--ok)}.dot.connecting{background:var(--warn)}.dot.down{background:var(--err)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:28px;padding:0 12px;border:1px solid var(--b1);border-radius:8px;background:var(--l1);color:var(--fg);font:inherit;font-size:12.5px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--l2);border-color:var(--b2)}.btn[disabled]{opacity:.5;cursor:default}
.btn.primary{background:var(--brand);border-color:transparent;color:var(--bg)}
.btn.danger{color:var(--err)}
.btn.link{border-color:transparent;background:transparent;height:24px;padding:0 6px;color:var(--fg2)}.btn.link:hover{color:var(--fg);background:var(--l2)}
select.btn{padding:0 8px}
.quiet{width:100%;height:26px;padding:0 8px;border:1px solid transparent;border-radius:7px;background:transparent;color:var(--fg);font:inherit;font-size:12.5px}
.quiet:hover{border-color:var(--b1)}.quiet:focus{outline:none;background:var(--bg);border-color:var(--b2)}
.num{width:64px;height:26px;padding:0 6px;text-align:center;border:1px solid var(--b1);border-radius:7px;background:var(--bg);color:var(--fg);font:inherit;font-size:12.5px}
.num:focus{outline:none;border-color:var(--b2)}
.mini{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--fg2);white-space:nowrap}
.switch{position:relative;width:36px;height:20px;padding:0;border:1px solid var(--b2);border-radius:999px;background:var(--l2);cursor:pointer;flex:0 0 auto}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--fg);transition:transform .14s ease}
.switch[aria-checked="true"]{background:var(--ok);border-color:var(--ok)}
.switch[aria-checked="true"]::after{transform:translateX(16px);background:#fff}
.switch.neutral[aria-checked="true"]{background:var(--l2);border-color:var(--b2)}.switch.neutral[aria-checked="true"]::after{background:var(--fg)}
.toggle-label{opacity:.55}.toggle-label.on{opacity:1;color:var(--fg)}
.card{border:1px solid var(--b1);border-radius:12px;background:var(--l1);padding:4px 16px}
.set{display:flex;align-items:center;gap:16px;padding:12px 0}.set+.set{border-top:1px solid var(--b1)}
.set-text{flex:1;min-width:0}.set-title{font-weight:500}.set-desc{font-size:12px;color:var(--fg2);line-height:18px}
.inst{display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;padding:11px 16px}.inst+.inst{border-top:1px solid var(--b1)}
.badge{display:inline-block;padding:0 7px;border:1px solid var(--b1);border-radius:999px;font-size:11px;color:var(--fg2)}
.badge.warn{color:var(--warn);border-color:var(--warn)}
.err{color:var(--err)}
.banner{padding:9px 14px;border:1px solid var(--err);border-radius:10px;color:var(--err);background:var(--l1)}
.notice{padding:9px 14px;border:1px solid var(--b1);border-radius:10px;color:var(--fg2);background:var(--l1)}
.prose{font-size:12.5px;color:var(--fg2);line-height:19px}
.foot{font-size:11.5px;color:var(--fg2);display:flex;flex-direction:column;gap:2px}
code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px}
.backdrop{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.5)}
.dialog{width:min(420px,100%);border:1px solid var(--b1);border-radius:14px;background:var(--overlay);box-shadow:0 24px 64px rgba(0,0,0,.35);padding:18px}
.dialog h3{margin:0 0 8px;font-size:15px}
.dialog label{display:block;margin-top:12px;font-size:11.5px;color:var(--fg2)}
.dialog input{width:100%;height:32px;margin-top:4px;padding:0 10px;border:1px solid var(--b1);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit}
.dialog .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
@media (max-width:1100px){.th{display:none}.c-host,.c-key{flex:1 1 100%}.c-ctl{flex:1 1 100%;flex-wrap:wrap}}
@media (max-width:900px){.top,.content{padding-left:16px;padding-right:16px}}
</style>
</head>
<body>
<div class="top">
  <div class="mark"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m7 9 3 3-3 3"/><path d="M13 15h4"/></svg></div>
  <div><div class="title">SSH 助手 · MCP</div><div class="sub">管理本机所有 dsh-ssh-mcp 进程：主机可见性、备注、设置和实时连接</div></div>
  <div class="grow"></div>
  <button class="btn" id="refresh">刷新</button>
  <button class="btn danger" id="closeAll">全部断开</button>
</div>
<div class="content" id="app"><div class="notice">加载中…</div></div>
<div id="dialog"></div>
<script>
(() => {
  'use strict';
  const app = document.getElementById('app');
  const dialogRoot = document.getElementById('dialog');
  let state = null;
  let token = null;
  let error = null;
  let notice = null;
  let busy = false;
  let dialog = null;

  const esc = (value) => String(value ?? '').replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[ch]);
  const STATE_LABEL = { connected: '已连接', connecting: '连接中', idle: '未连接', down: '已断开' };
  const ago = (ms) => {
    const s = Math.max(0, Math.round((Date.now() - ms) / 1000));
    if (s < 60) return `${s} 秒前`;
    if (s < 3600) return `${Math.round(s / 60)} 分钟前`;
    if (s < 86400) return `${Math.round(s / 3600)} 小时前`;
    return `${Math.round(s / 86400)} 天前`;
  };
  const clientName = (instance) => {
    const client = instance.client;
    if (!client || typeof client.name !== 'string') return '（未初始化）';
    return `${client.name}${client.version ? ` ${client.version}` : ''}`;
  };

  async function call(path, body, { silent = false } = {}) {
    if (!silent) { busy = true; syncBusy(); }
    try {
      const headers = { accept: 'application/json' };
      if (token) headers['x-dsh-ssh-pool-token'] = token;
      if (body !== undefined) headers['content-type'] = 'application/json';
      const response = await fetch(`/api/${path}`, {
        method: body === undefined ? 'GET' : 'POST',
        headers,
        credentials: 'same-origin',
        ...(body === undefined ? {} : { body: JSON.stringify(body) })
      });
      const payload = await response.json().catch(() => null);
      if (payload && typeof payload.token === 'string') token = payload.token;
      if (!response.ok || !payload || payload.ok !== true) throw new Error(payload?.error ?? `HTTP ${response.status}`);
      if (payload.state) state = payload.state;
      error = null;
      return payload;
    } catch (failure) {
      error = `${body === undefined ? '读取状态失败' : '保存失败'}：${failure.message}`;
      throw failure;
    } finally {
      if (!silent) busy = false;
      render();
    }
  }
  const load = (silent) => call('state', undefined, { silent }).catch(() => undefined);
  const post = (path, body) => call(path, body).catch(() => undefined);

  function syncBusy() {
    for (const el of document.querySelectorAll('[data-act]')) el.disabled = busy;
  }

  /** Never re-render under the user's cursor: a poll would eat a half-typed remark. */
  function editing() {
    const active = document.activeElement;
    return dialog !== null || (active && (active.tagName === 'INPUT' || active.tagName === 'SELECT'));
  }

  function renderInstances() {
    const instances = state.instances ?? [];
    const rows = instances.map((instance) => `
      <div class="inst">
        <span class="name">${esc(clientName(instance))}</span>
        <span class="muted small">pid ${esc(instance.pid)}${instance.version ? ` · v${esc(instance.version)}` : ''}${instance.startedAt ? ` · 启动于 ${esc(ago(instance.startedAt))}` : ''}</span>
        ${instance.error ? `<span class="err small">无法连接控制端口：${esc(instance.error)}</span>` : `
          <span class="small">${esc(instance.connected ?? 0)} / ${esc(instance.hostCount ?? 0)} 台已连接</span>
          ${instance.diagnostics ? `<span class="muted small">调用 ${esc(instance.diagnostics.counters?.toolCalls ?? 0)} · 失败 ${esc(instance.diagnostics.counters?.failures ?? 0)} · 拦截 ${esc(instance.diagnostics.counters?.policyDenials ?? 0)} · 超时 ${esc(instance.diagnostics.counters?.timeouts ?? 0)}</span>` : ''}
          ${instance.followsDsh ? `<span class="badge warn" title="${esc(instance.statePath)}">跟随其他状态文件，这里的隐藏/设置对它无效</span>` : ''}
          ${instance.analysis?.available ? `<span class="badge">旁路分析可用</span>` : ''}`}
        <span class="grow"></span>
        ${instance.error ? '' : `<button class="btn link" data-act data-close-pid="${esc(instance.pid)}">断开它的全部连接</button>`}
      </div>`).join('');
    return `
      <section>
        <div class="sec">MCP 进程 <span class="badge">${instances.length}</span></div>
        <div class="note">每个客户端会话各起一个 dsh-ssh-mcp 进程，各有自己的连接池；进程启动后会自动出现在这里。</div>
        <div class="table">${rows || '<div class="inst muted">没有正在运行的 MCP 进程。启动一个使用此 server 的客户端会话后，这里会显示它。</div>'}</div>
      </section>`;
  }

  function renderHosts() {
    const instances = (state.instances ?? []).filter((instance) => !instance.error);
    const hosts = state.hosts ?? [];
    const rows = hosts.map((host) => {
      const live = host.instances ?? [];
      const connectedIn = live.filter((report) => report.connected);
      const editable = host.source === 'ssh-config';
      const sessions = host.sessions?.length ?? 0;
      const where = live.map((report) => `${report.client?.name ?? 'pid ' + report.pid}: ${STATE_LABEL[report.state] ?? report.state}`).join('\n');
      let open = '';
      if (instances.length === 1) open = `<button class="btn open" data-act data-open="${esc(host.alias)}" ${host.connected ? 'disabled' : ''}>连接</button>`;
      else if (instances.length > 1) open = `<select class="btn" data-act data-open-from="${esc(host.alias)}"><option value="">连接…</option>${instances.map((instance) => `<option value="${esc(instance.pid)}">${esc(clientName(instance))} (pid ${esc(instance.pid)})</option>`).join('')}</select>`;
      else open = `<button class="btn open" disabled title="没有正在运行的 MCP 进程">连接</button>`;
      return `
        <div class="row">
          <div class="c-host">
            <div class="name ell" title="${esc(host.alias)}">${esc(host.alias)}</div>
            <div class="muted small ell">${esc(host.user ?? '')}@${esc(host.host)}:${esc(host.port)}</div>
          </div>
          <div class="c-key">
            <div class="ell" title="${esc(host.keyName ?? '')}">${esc(host.keyName ?? '—')}</div>
            ${editable ? `<button class="btn link small" data-act data-edit="${esc(host.alias)}">编辑</button>` : '<span class="muted small">插件配置</span>'}
          </div>
          <div class="c-state" title="${esc(where)}">
            <div class="state-main"><span class="dot ${esc(host.state)}"></span>${esc(host.retryPaused ? '已暂停' : STATE_LABEL[host.state] ?? host.state)}</div>
            <div class="muted small">${connectedIn.length > 1 ? `${connectedIn.length} 个进程 · ` : ''}${sessions} 会话 · ${esc(host.commands ?? 0)} 命令</div>
            ${host.lastError ? `<div class="err small ell" title="${esc(host.lastError)}">${esc(host.lastError)}</div>` : ''}
          </div>
          <div class="c-ctl">
            ${open}
            <button class="btn" data-act data-close="${esc(host.alias)}" ${host.connected || host.state === 'connecting' ? '' : 'disabled'}>断开</button>
            <span class="mini" title="隐藏后 agent 看不到也连不上该主机，各 MCP 进程约 1 秒内断开现有连接。">
              <span class="toggle-label ${host.hidden ? '' : 'on'}">可见</span>
              <button class="switch neutral" role="switch" aria-checked="${host.hidden ? 'true' : 'false'}" data-act data-hide="${esc(host.alias)}"></button>
              <span class="toggle-label ${host.hidden ? 'on' : ''}">隐藏</span>
            </span>
            <span class="mini">超时 <input class="num" type="number" min="0" placeholder="全局" title="单独的空闲超时（秒）；留空跟随全局" value="${host.idleTimeoutMs === null || host.idleTimeoutMs === undefined ? '' : esc(Math.round(host.idleTimeoutMs / 1000))}" data-idle="${esc(host.alias)}"></span>
          </div>
          <div class="c-remark"><input class="quiet" placeholder="备注…" maxlength="500" value="${esc(host.remark ?? '')}" data-remark="${esc(host.alias)}"></div>
        </div>`;
    }).join('');
    const hiddenCount = hosts.filter((host) => host.hidden).length;
    return `
      <section>
        <div class="sec">连接 <span class="badge">${esc(state.totals?.connected ?? 0)} / ${hosts.length}</span>${hiddenCount ? `<span class="badge">${hiddenCount} 台隐藏</span>` : ''}</div>
        <div class="note">「隐藏」后任何 MCP 会话都看不到、也连不上它，已有连接会被断开；这里仍可管理。连接状态汇总自所有进程，悬停可看明细。</div>
        <div class="table">
          <div class="th"><div class="c-host">主机</div><div class="c-key">密钥</div><div class="c-state">状态</div><div class="c-ctl">操作</div><div class="c-remark">备注</div></div>
          ${rows || '<div class="row muted">没有可用的 SSH 主机：检查 ~/.ssh/config 或 --config。</div>'}
        </div>
      </section>`;
  }

  function renderSettings() {
    const s = state.settings ?? {};
    const setting = (title, desc, control) => `<div class="set"><div class="set-text"><div class="set-title">${title}</div><div class="set-desc">${desc}</div></div>${control}</div>`;
    return `
      <section>
        <div class="sec">设置</div>
        <div class="card">
          ${setting('命令输出上限', '每条命令回传的每个流（stdout / stderr）的字节上限，单位 KB；默认 32 KB，超出时保留头尾并标注省略。', `<input class="num" type="number" min="1" max="4096" value="${esc(Math.round((s.maxOutputBytes ?? 32768) / 1024))}" data-setting="maxOutputBytes" data-scale="1024">`)}
          ${setting('空闲超时', '秒；0 = 永不自动断开。未使用时不创建连接，只有会话真正用到该主机才首次建连。', `<input class="num" type="number" min="0" value="${esc(Math.round((s.idleTimeoutMs ?? 0) / 1000))}" data-setting="idleTimeoutMs" data-scale="1000">`)}
          ${setting('文件传输超时', '秒。单次 SFTP 上传/下载的默认时限，默认 600 秒。', `<input class="num" type="number" min="5" max="7200" value="${esc(Math.round((s.transferTimeoutMs ?? 600000) / 1000))}" data-setting="transferTimeoutMs" data-scale="1000">`)}
          ${setting('日志旁路分析', '开启后，较大的日志读取/搜索会交给客户端的模型（MCP sampling）做旁路分析，主会话只收到摘要；需要原文时传 analyze:false。日志会先脱敏。客户端不支持 sampling 时不生效。', `<button class="switch" role="switch" aria-checked="${s.logAnalysis ? 'true' : 'false'}" data-act data-toggle-setting="logAnalysis"></button>`)}
          ${setting('主机密钥策略', '来自 --config 的 hostKeyPolicy，这里只读。', `<code>${esc(s.hostKeyPolicy ?? '—')}</code>`)}
        </div>
      </section>`;
  }

  function render() {
    if (editing() && state !== null) return;
    if (state === null) {
      app.innerHTML = error ? `<div class="banner">${esc(error)}</div>` : '<div class="notice">加载中…</div>';
      return;
    }
    const panel = state.panel ?? {};
    app.innerHTML = `
      ${error ? `<div class="banner">${esc(error)}</div>` : ''}
      ${notice ? `<div class="notice">${esc(notice)}</div>` : ''}
      ${renderInstances()}
      ${renderHosts()}
      ${renderSettings()}
      <section>
        <div class="sec">命令护栏</div>
        <div class="card"><div class="set"><div class="prose">只拦会让整台机器报废的操作：递归/通配删除系统关键目录、mkfs/分区、dd 或 &gt; 写块设备、覆写系统关键文件、递归 chmod/chown 系统目录。业务目录和普通维护不拦。护栏在工具内部执行，这里不能关闭。</div></div></div>
      </section>
      <div class="foot">
        <div>状态文件：<code>${esc(panel.statePath)}</code>（仅本面板写入，各 MCP 进程只读跟随）</div>
        ${panel.sshConfigPath ? `<div>SSH 配置：<code>${esc(panel.sshConfigPath)}</code></div>` : ''}
        ${(panel.warnings ?? []).map((warning) => `<div class="err">${esc(warning)}</div>`).join('')}
      </div>`;
    syncBusy();
  }

  function openEdit(alias) {
    const host = state.hosts.find((candidate) => candidate.alias === alias);
    if (!host) return;
    dialog = { alias };
    dialogRoot.innerHTML = `
      <div class="backdrop">
        <form class="dialog">
          <h3>编辑连接</h3>
          <div class="prose">Host 名和密钥文件名可以一起改；保存时会备份 ~/.ssh/config，密钥文件会被真实重命名。任一项失败都不会写入。</div>
          <label>Host 名<input name="alias" value="${esc(host.alias)}" autocomplete="off"></label>
          ${host.keyName && !String(host.keyName).startsWith('agent:') ? `<label>密钥文件名<input name="key" value="${esc(host.keyName)}" autocomplete="off"></label>` : ''}
          <div class="prose" style="margin-top:10px">改名后会话里要用新的 Host 名；正在运行的连接会在下次使用时重建。</div>
          <div class="err small" id="dialogError"></div>
          <div class="actions"><button type="button" class="btn" id="dialogCancel">取消</button><button class="btn primary">保存</button></div>
        </form>
      </div>`;
    const form = dialogRoot.querySelector('form');
    const close = () => { dialog = null; dialogRoot.innerHTML = ''; render(); };
    dialogRoot.querySelector('#dialogCancel').onclick = close;
    dialogRoot.querySelector('.backdrop').addEventListener('mousedown', (event) => { if (event.target === event.currentTarget) close(); });
    form.onsubmit = async (event) => {
      event.preventDefault();
      const newAlias = form.alias.value.trim();
      const keyName = form.key ? form.key.value.trim() : undefined;
      const body = { alias };
      if (newAlias && newAlias !== host.alias) body.newAlias = newAlias;
      if (keyName && keyName !== host.keyName) body.keyName = keyName;
      if (!body.newAlias && !body.keyName) { close(); return; }
      try {
        await call('edit-host', body);
        close();
      } catch (failure) {
        dialogRoot.querySelector('#dialogError').textContent = failure.message;
      }
    };
    form.alias.focus();
  }

  app.addEventListener('click', (event) => {
    const el = event.target.closest('button');
    if (!el || el.disabled) return;
    const d = el.dataset;
    if (d.open) post('action', { action: 'open', alias: d.open });
    else if (d.close) post('action', { action: 'close', alias: d.close });
    else if (d.closePid) post('action', { action: 'close_all', pid: Number(d.closePid) });
    else if (d.hide) {
      const host = state.hosts.find((candidate) => candidate.alias === d.hide);
      post('meta', { alias: d.hide, hidden: !host?.hidden }).then(() => setTimeout(() => load(true), 1500));
    } else if (d.toggleSetting) post('settings', { [d.toggleSetting]: !(state.settings ?? {})[d.toggleSetting] });
    else if (d.edit) openEdit(d.edit);
  });
  app.addEventListener('change', (event) => {
    const el = event.target;
    const d = el.dataset;
    if (d.remark !== undefined) post('meta', { alias: d.remark, remark: el.value });
    else if (d.idle !== undefined) post('meta', { alias: d.idle, idleTimeoutMs: el.value.trim() === '' ? null : Math.max(0, Number(el.value)) * 1000 });
    else if (d.setting !== undefined) post('settings', { [d.setting]: Number(el.value) * Number(d.scale ?? 1) });
    else if (d.openFrom !== undefined && el.value) {
      const pid = Number(el.value);
      el.value = '';
      el.blur();
      post('action', { action: 'open', alias: d.openFrom, pid });
    }
  });
  app.addEventListener('keydown', (event) => {
    if (event.key === 'Enter' && event.target.tagName === 'INPUT') event.target.blur();
  });
  app.addEventListener('focusout', () => setTimeout(render, 0));
  document.getElementById('refresh').onclick = () => load(false);
  document.getElementById('closeAll').onclick = () => {
    if (confirm('断开所有 MCP 进程里的全部 SSH 连接？')) post('action', { action: 'close_all' });
  };

  load(false);
  setInterval(() => { if (!document.hidden) load(true); }, 3000);
})();
</script>
</body>
</html>
